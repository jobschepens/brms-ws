# ===========================================================================
# GitLab CI/CD Pipeline for BRMS Workshop (gitlab.git.nrw)
# ===========================================================================
# 1. Builds and publishes the container to GitLab's own Container Registry
#    using Red Hat Buildah (quay.io/buildah/stable) with chroot isolation.
# 2. Uses the GitLab container to render Quarto tutorials in CI.
# 3. Publishes rendered notebooks and HTML files to GitLab Pages.
# Completely independent of GitHub.
# ===========================================================================

stages:
  - build
  - deploy

variables:
  IMAGE_TAG_WORKING: "$CI_REGISTRY_IMAGE:working"
  IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"
  IMAGE_TAG_COMMIT: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# ---------------------------------------------------------------------------
# 1. Build and push workshop container to GitLab Container Registry (Buildah)
# ---------------------------------------------------------------------------
build-container:
  stage: build
  image:
    name: quay.io/buildah/stable
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Build container image with Docker format and tags
    - |
      buildah build \
        --format docker \
        -t "$IMAGE_TAG_WORKING" \
        -t "$IMAGE_TAG_LATEST" \
        -t "$IMAGE_TAG_COMMIT" \
        .
    - buildah push "$IMAGE_TAG_WORKING"
    - buildah push "$IMAGE_TAG_LATEST"
    - buildah push "$IMAGE_TAG_COMMIT"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile
        - install.R
        - docker-compose.yml
        - docker/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Allow manual trigger from GitLab UI

# ---------------------------------------------------------------------------
# 2. Render Quarto tutorials & publish to GitLab Pages
# ---------------------------------------------------------------------------
# Uses GitLab's own container built by the job above ($CI_REGISTRY_IMAGE:working)
pages:
  stage: deploy
  needs:
    - job: build-container
      artifacts: false
      optional: true
  image:
    name: $CI_REGISTRY_IMAGE:working
    entrypoint: [""]
  script:
    # 1. Ensure Quarto is in PATH and render session29 tutorial
    - export PATH="/usr/lib/rstudio-server/bin/quarto/bin:$PATH"
    - quarto render materials/lme4/session29-lme4-model-criticism.qmd --to html
    # 2. Assemble GitLab Pages artifact (public/)
    - mkdir -p public/lme4
    - cp -r materials/scripts/* public/
    - cp materials/lme4/session29-lme4-model-criticism.html public/lme4/
    - if [ -d materials/lme4/session29-lme4-model-criticism_files ]; then cp -r materials/lme4/session29-lme4-model-criticism_files public/lme4/; fi
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - materials/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Allow manual trigger from GitLab UI