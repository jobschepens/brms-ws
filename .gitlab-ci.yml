# ===========================================================================
# GitLab CI/CD Pipeline for BRMS Workshop (gitlab.git.nrw)
# ===========================================================================
# 1. Populates GitLab's Container Registry directly from the verified GHCR image
#    using Skopeo (fast, lightweight, zero compilation, zero OOM risk).
# 2. Uses GitLab's own container to render Quarto tutorials in CI.
# 3. Publishes rendered notebooks and HTML files to GitLab Pages.
# Completely independent of GitHub at render and runtime.
# ===========================================================================

stages:
  - build
  - deploy

variables:
  IMAGE_TAG_WORKING: "$CI_REGISTRY_IMAGE:working"
  IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"
  IMAGE_TAG_COMMIT: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# ---------------------------------------------------------------------------
# 1. Sync container to GitLab Container Registry (Skopeo)
# ---------------------------------------------------------------------------
build-container:
  stage: build
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  script:
    - echo "Syncing verified R 4.6.1 container to GitLab Container Registry..."
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" docker://ghcr.io/jobschepens/brms-workshop:working docker://$IMAGE_TAG_WORKING
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" docker://$IMAGE_TAG_WORKING docker://$IMAGE_TAG_LATEST
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" docker://$IMAGE_TAG_WORKING docker://$IMAGE_TAG_COMMIT
    - echo "Container image successfully published to $IMAGE_TAG_WORKING"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile
        - install.R
        - docker-compose.yml
        - docker/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Allow manual trigger from GitLab UI

# ---------------------------------------------------------------------------
# 2. Render Quarto tutorials & publish to GitLab Pages
# ---------------------------------------------------------------------------
# Uses GitLab's own container synced by the job above ($CI_REGISTRY_IMAGE:working)
pages:
  stage: deploy
  needs:
    - job: build-container
      artifacts: false
      optional: true
  image:
    name: $CI_REGISTRY_IMAGE:working
    entrypoint: [""]
  script:
    # 1. Ensure Quarto is in PATH and render session29 tutorial
    - export PATH="/usr/lib/rstudio-server/bin/quarto/bin:$PATH"
    - quarto render materials/lme4/session29-lme4-model-criticism.qmd --to html
    # 2. Assemble GitLab Pages artifact (public/)
    - mkdir -p public/lme4
    - cp -r materials/scripts/* public/
    - cp materials/lme4/session29-lme4-model-criticism.html public/lme4/
    - if [ -d materials/lme4/session29-lme4-model-criticism_files ]; then cp -r materials/lme4/session29-lme4-model-criticism_files public/lme4/; fi
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - materials/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Allow manual trigger from GitLab UI