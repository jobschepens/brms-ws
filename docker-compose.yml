# Docker Compose configuration for BRMS Workshop
# This sets up an RStudio Server environment with brms (Bayesian Regression Models using Stan)
# and CmdStan for Bayesian statistical modeling
#
# Usage:
#   docker compose up -d              # Start in detached mode
#   docker compose logs -f            # View logs
#   docker compose down               # Stop and remove containers
#   docker compose pull              # Pull the image published by CI
#
# Access RStudio Server at: http://localhost:8787
# Default credentials: username=rstudio, password=workshop

services:
  brms-workshop:
    # The image is built and published by GitHub Actions.
    image: ghcr.io/jobschepens/brms-workshop:working
    container_name: brms-workshop

    # Network configuration
    ports:
      - "127.0.0.1:8787:8787"  # Local-only RStudio access

    # RStudio Server configuration
    environment:
      - PASSWORD=${RSTUDIO_PASSWORD:-workshop}
      - USERID=${RSTUDIO_USERID:-1000}
      - ROOT=${RSTUDIO_ROOT:-false}
      # Optional: Set timezone (defaults to Etc/UTC)
      # - TZ=Europe/Brussels

    # Volume mounts for persistent data
    volumes:
      # Mount workshop materials (for development/editing)
      # Changes in ./materials/ are immediately reflected in RStudio
      - ./materials:/home/rstudio/workshop/materials

      # Persist analysis results outside container
      - ./results:/home/rstudio/workshop/results
      # Mount collaborator package workspace
      - ../vicom-4lang:/home/rstudio/workshop/vicom-4lang
      - ../temp/katja:/home/rstudio/workshop/temp/katja
      - ../samplesize:/home/rstudio/workshop/samplesize
      - ../cont:/home/rstudio/cont

      # Optional: Mount additional data or scripts
      # - ./data:/home/rstudio/workshop/data:ro  # :ro = read-only

    # Container lifecycle policy
    restart: unless-stopped  # Auto-restart on failure, but not after manual stop

    # Resource limits and reservations (adjust based on host machine specs)
    # cpus: '8'           # Limit to 8 CPU cores (uncomment to cap CPU usage)
    # mem_limit: 16g      # Maximum RAM allocation (uncomment if you want a hard cap)
    # mem_reservation: 6g # Soft limit (uncomment if your host has at least 8-16 GB free)
    shm_size: 2g        # Shared memory for Stan compilation (important for parallel chains)

    # Alternative: Use deploy section for more control (works with docker compose v3.8+)
    # Uncomment below and comment out cpus/mem_limit above to use
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 12G
    #     reservations:
    #       cpus: '4'
    #       memory: 4G

    # Health check to verify RStudio Server is responding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Allow time for CmdStan installation on first run

    # Metadata labels for documentation and management
    labels:
      com.brms-workshop.description: "RStudio Server with brms and CmdStan"
      com.brms-workshop.version: "R-4.6.1"
      com.brms-workshop.service: "rstudio-server"

    # Debugging options (uncomment when troubleshooting)
    # stdin_open: true   # Keep STDIN open
    # tty: true          # Allocate pseudo-TTY
    # command: /bin/bash # Override entrypoint for shell access
