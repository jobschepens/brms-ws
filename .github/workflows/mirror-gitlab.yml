name: Mirror to GitLab NRW

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror repository to gitlab.git.nrw
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Push to GitLab NRW
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USER: ${{ secrets.GITLAB_USERNAME || 'jschepen' }}
          GITLAB_HOST: gitlab.git.nrw
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT || 'brms-ws' }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN is not configured. Skipping mirror to GitLab."
            exit 0
          fi
          echo "Mirroring to https://${GITLAB_HOST}/${GITLAB_USER}/${GITLAB_PROJECT}.git"
          git -c lfs.allowincompletepush=true push --prune \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/${GITLAB_USER}/${GITLAB_PROJECT}.git" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"