name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Add lme4 workshop to Pages artifact
        run: |
          mkdir -p materials/scripts/lme4
          cp materials/lme4/session29-lme4-model-criticism.html materials/scripts/lme4/
          cp -R materials/lme4/session29-lme4-model-criticism_files materials/scripts/lme4/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'materials/scripts'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
